<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blinks Arcade</title>
<meta name="description" content="Ten one-button games for Blinks, playable in the browser. Drag Blinks together to switch from solo to connected play.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bungee&family=Chewy&family=Cinzel+Decorative:wght@900&family=Fredoka:wght@600;700&family=Kaushan+Script&family=Lilita+One&family=Righteous&family=Rye&family=Shrikhand&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  /* Layout: cartridge shelf on the left, a dark play table lit by the current game's splash art, rules strip beneath the table */
  --bg:#14111b; --panel:#1d1827; --panel-2:#2a2337; --line:#30283f; --text:#eee9f5; --muted:#a69db8; --blinks:#FA4616;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-disp:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:14px;-webkit-font-smoothing:antialiased}
.app{height:100%;box-sizing:border-box;display:grid;grid-template-columns:340px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:14px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 16px}
.top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;gap:6px 16px;align-items:center;flex-wrap:wrap;min-width:0}
.logo{height:37px;width:auto;display:block;flex:none}
h1{display:flex;align-items:center;gap:9px;font-family:var(--f-disp);font-weight:800;font-size:27px;margin:0;letter-spacing:-.01em;line-height:1}
.brand p{margin:0;color:var(--muted);font-size:13px;padding-left:16px;border-left:1px solid var(--line);line-height:1.3}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button,.btn{font:600 13px var(--f-ui);color:var(--text);background:transparent;border:0;border-radius:7px;padding:7px 11px;cursor:pointer}
.seg button:hover{background:var(--panel-2)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 13px}
.btn:hover{border-color:#4a3f5e;background:var(--panel-2)}
button:focus-visible{outline:2px solid var(--blinks);outline-offset:2px}

.shelf{min-height:0;overflow-y:auto;padding-right:6px;scrollbar-width:thin;scrollbar-color:#3a3150 transparent}
.shelf h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:2px 0 8px;font-weight:600}
.carts{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;padding:0 2px 10px}
.cart{position:relative;display:block;width:100%;aspect-ratio:1;max-width:100%;padding:0;border:0;background:none;cursor:pointer;container-type:inline-size;transition:transform .15s ease,filter .15s ease;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
.cart:hover{transform:translateY(-3px)}
.cart:focus-visible{outline:none;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 6px 8px rgba(0,0,0,.45))}
.cart[aria-pressed="true"]{filter:drop-shadow(0 0 2px var(--blinks)) drop-shadow(0 0 9px rgba(250,70,22,.85))}
/* window of the cartridge frame, measured from the 1024px source: x 144–881, y 238–645 */
.art{position:absolute;left:14.06%;top:23.24%;width:71.97%;height:39.75%;-webkit-mask:url(assets/cartridge-window-mask.png) center/100% 100% no-repeat;mask:url(assets/cartridge-window-mask.png) center/100% 100% no-repeat}
.art canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.frame{position:absolute;inset:0;background:url(assets/cartridge-frame.png) center/100% 100% no-repeat}
.ttl{position:absolute;left:31%;right:14%;top:26%;height:27%;display:grid;place-items:center;text-align:center;font-size:calc(9.4cqw * var(--ts,1));line-height:.92;color:var(--ink);white-space:nowrap}
.outline{text-shadow:0 .06em 0 var(--sk),.06em 0 0 var(--sk),-.06em 0 0 var(--sk),0 -.06em 0 var(--sk),.045em .045em 0 var(--sk),-.045em .045em 0 var(--sk),.045em -.045em 0 var(--sk),-.045em -.045em 0 var(--sk),0 .12em 0 var(--sk)}

.stage{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:12px}
.board-wrap{position:relative;min-height:0;border-radius:16px;overflow:hidden;background:#0d0b12;border:1px solid var(--line)}
#splash,#board,.shade{position:absolute;inset:0;width:100%;height:100%;display:block}
#splash{filter:saturate(1.08) blur(1.5px);transform:scale(1.03)}
.shade{background:radial-gradient(ellipse at 50% 56%,rgba(13,10,20,.28) 0%,rgba(13,10,20,.56) 55%,rgba(13,10,20,.86) 100%)}
#board{touch-action:none;outline:none}
#board:focus-visible{box-shadow:inset 0 0 0 2px var(--blinks)}
.np{position:absolute;left:18px;top:14px;pointer-events:none;max-width:min(62%,440px)}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.72);font-weight:700}
.np-title{font-size:clamp(28px,3.6vw,46px);line-height:1.02;margin-top:6px;color:var(--ink)}
.np-pitch{margin-top:10px;font-size:13.5px;color:#f3eff8;background:rgba(14,11,20,.66);display:inline-block;padding:5px 11px;border-radius:99px}
.status{position:absolute;left:16px;bottom:12px;right:96px;font:500 11.5px/1.5 var(--f-mono);color:rgba(255,255,255,.66);pointer-events:none}

.rules{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(230px,.9fr);gap:14px 26px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.rules h3{margin:0 0 6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--blinks);font-weight:700}
.rules p{margin:0;line-height:1.5;color:#dcd6e7;font-size:13.5px;max-width:62ch}
.rules ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rules li{display:flex;gap:10px;align-items:center;font-size:13px;color:#dcd6e7}
.chip{display:inline-flex;align-items:center;gap:7px;flex:none;min-width:116px;box-sizing:border-box;padding:3px 9px;border-radius:7px;background:var(--panel-2);border:1px solid #3a3150;font:600 11.5px var(--f-mono);color:var(--text)}
.chip .gl{color:var(--blinks);letter-spacing:-.05em}

@media (max-width:900px){
  .brand p{border-left:0;padding-left:0;flex-basis:100%}
  html,body{height:auto}
  .app{height:auto;display:flex;flex-direction:column}
  .stage{display:flex;flex-direction:column}
  .board-wrap{height:62vh;min-height:400px}
  .shelf{order:3;overflow:visible;padding:0}
  .carts{display:flex;overflow-x:auto;gap:12px;padding-bottom:10px;scroll-snap-type:x mandatory}
  .cart{flex:none;width:150px;scroll-snap-align:start}
  .rules{grid-template-columns:minmax(0,1fr)}
  .np{max-width:86%}
  .status{right:84px}
}
@media (prefers-reduced-motion:reduce){.cart{transition:none}.cart:hover{transform:none}}
</style>
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1><img class="logo" src="assets/blinks-logo.svg" alt="Blinks" width="84" height="37"><span>Arcade</span></h1>
      <p>Ten one-button games for Blinks</p>
    </div>
    <div class="tools" role="toolbar" aria-label="Table setup">
      <span class="lbl">Layout</span>
      <div class="seg">
        <button type="button" data-layout="solo">Solo</button>
        <button type="button" data-layout="pair">Pair</button>
        <button type="button" data-layout="trio">Trio</button>
        <button type="button" data-layout="mixed">2 + 1</button>
        <button type="button" data-layout="flower">Flower</button>
      </div>
      <button type="button" class="btn" id="addTile">+ Tile</button>
      <button type="button" class="btn" id="restart">Restart game</button>
    </div>
  </header>

  <aside class="shelf" aria-label="Game cartridges">
    <h2>Cartridges</h2>
    <div class="carts" id="carts"></div>
  </aside>

  <main class="stage">
    <div class="board-wrap" id="boardWrap">
      <canvas id="splash" aria-hidden="true"></canvas>
      <div class="shade"></div>
      <canvas id="board" tabindex="0" aria-label="Game table. Press the center of a tile to use its button; drag a tile by its rim to move it."></canvas>
      <div class="np"><div class="eyebrow">Now playing</div><div id="npTitle" class="np-title outline"></div><div id="npPitch" class="np-pitch"></div></div>
      <div class="status" id="status"></div>
    </div>
    <section class="rules" aria-live="polite">
      <div><h3>On its own</h3><p id="rSolo"></p></div>
      <div><h3>Tiles touching</h3><p id="rLink"></p></div>
      <div><h3>Gestures</h3><ul id="rCtl"></ul></div>
    </section>
  </main>
</div>

<script>
(() => {
"use strict";
/* ---------- helpers ---------- */
const TAU = Math.PI * 2, SQ3 = Math.sqrt(3);
const LONG_MS = 700, MULTI_MS = 330;
const DIRS = [[0,-1],[1,-1],[1,0],[0,1],[-1,1],[-1,0]]; // face 0 = top, clockwise (flat-top axial)
const hk = (q, r) => q + "," + r;
const ri = n => Math.floor(Math.random() * n);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const scl = (c, k) => [c[0]*k, c[1]*k, c[2]*k];
const mix = (a, b, t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
const maxc = (a, b) => [Math.max(a[0],b[0]), Math.max(a[1],b[1]), Math.max(a[2],b[2])];
const six = c => [0,1,2,3,4,5].map(() => c.slice());
const pulse = (now, ms, lo, hi) => lo + (hi - lo) * (.5 + .5 * Math.sin(now / ms * TAU));
function hsv(h, s = 1, v = 1) {
  h = ((h % 360) + 360) % 360 / 60;
  const i = Math.floor(h), f = h - i, p = v*(1-s), q = v*(1-s*f), t = v*(1-s*(1-f));
  return [[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i % 6].map(x => x * 255);
}
const hueDist = (a, b) => { const d = Math.abs(((a - b) % 360 + 360) % 360); return d > 180 ? 360 - d : d; };
const PCOL = [[255,70,50],[30,150,255],[255,200,0],[170,70,255],[0,225,130],[255,100,190],[255,130,0],[90,240,255]];
const pc = i => PCOL[i % PCOL.length];
const sk = (t, f) => t.id * 8 + f;
function segNbrs(C, t, f) {
  const a = [[t,(f+1)%6],[t,(f+5)%6]];
  const n = C.nb(t, f); if (n) a.push([n,(f+3)%6]);
  return a;
}
let say = () => {};

/* ---------- art helpers ---------- */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function lin(c,x0,y0,x1,y1,st){ const g=c.createLinearGradient(x0,y0,x1,y1); st.forEach(([o,col])=>g.addColorStop(o,col)); return g; }
function rad(c,x0,y0,r0,x1,y1,r1,st){ const g=c.createRadialGradient(x0,y0,Math.max(0,r0),x1,y1,Math.max(.01,r1)); st.forEach(([o,col])=>g.addColorStop(o,col)); return g; }
function circle(c,x,y,r){ c.beginPath(); c.arc(x,y,Math.max(0,r),0,TAU); }
function hexPath(c,x,y,r,rot=0){ c.beginPath(); for(let i=0;i<6;i++){ const a=rot+i*Math.PI/3, px=x+r*Math.cos(a), py=y+r*Math.sin(a); i?c.lineTo(px,py):c.moveTo(px,py);} c.closePath(); }
function hexPoint(cx,cy,r,s){ s=((s%1)+1)%1; const e=s*6, i=Math.floor(e), f=e-i, a0=i*Math.PI/3, a1=(i+1)*Math.PI/3; return [cx+r*(Math.cos(a0)*(1-f)+Math.cos(a1)*f), cy+r*(Math.sin(a0)*(1-f)+Math.sin(a1)*f)]; }
function heart(c,x,y,s){ c.beginPath(); c.moveTo(x,y+s*.6); c.bezierCurveTo(x+s*1.2,y-s*.1,x+s*.6,y-s*1.0,x,y-s*.35); c.bezierCurveTo(x-s*.6,y-s*1.0,x-s*1.2,y-s*.1,x,y+s*.6); c.fill(); }
function leaf(c,x,y,L,a,col){ c.save(); c.translate(x,y); c.rotate(a); c.fillStyle=col; c.beginPath(); c.moveTo(0,0); c.quadraticCurveTo(L*.5,-L*.3,L,0); c.quadraticCurveTo(L*.5,L*.3,0,0); c.fill(); c.strokeStyle="rgba(255,255,255,.14)"; c.lineWidth=Math.max(1,L*.02); c.beginPath(); c.moveTo(0,0); c.lineTo(L*.95,0); c.stroke(); c.restore(); }

/* ---------- cover art (original, procedural) ---------- */
const ART = {
orbit(c,w,h,t){
  const u=Math.min(w,h);
  c.fillStyle=lin(c,0,0,w,h,[[0,"#0a0d35"],[.6,"#1d0f4a"],[1,"#3b0f4f"]]); c.fillRect(0,0,w,h);
  const R=rng(11), n=Math.min(260,Math.round(w*h/700));
  c.fillStyle="#fff";
  for(let i=0;i<n;i++){ const x=R()*w,y=R()*h,s=R()*1.5+.4,ph=R()*TAU; c.globalAlpha=.25+.6*(.5+.5*Math.sin(t*1.7+ph)); c.fillRect(x,y,s,s); }
  c.globalAlpha=1;
  const px=w*.82, py=h*.82, pr=u*.52;
  c.fillStyle=rad(c,px-pr*.35,py-pr*.45,pr*.05,px,py,pr,[[0,"#ffd08a"],[.45,"#ff7a6b"],[1,"#4a1460"]]); circle(c,px,py,pr); c.fill();
  c.save(); c.translate(px,py); c.rotate(-.32); c.strokeStyle="rgba(255,214,170,.6)"; c.lineWidth=u*.03; c.beginPath(); c.ellipse(0,0,pr*1.5,pr*.3,0,0,TAU); c.stroke(); c.restore();
  const cx=w*.3, cy=h*.46, orr=u*.36;
  c.setLineDash([u*.02,u*.03]); c.strokeStyle="rgba(150,190,255,.5)"; c.lineWidth=Math.max(1,u*.01); hexPath(c,cx,cy,orr); c.stroke(); c.setLineDash([]);
  const ta=5*Math.PI/3, tx=cx+orr*Math.cos(ta), ty=cy+orr*Math.sin(ta);
  c.fillStyle="rgba(255,180,40,.28)"; circle(c,tx,ty,u*.08); c.fill();
  c.strokeStyle="#ffb52e"; c.lineWidth=Math.max(1,u*.014); circle(c,tx,ty,u*.05); c.stroke();
  for(let k=20;k>=0;k--){ const p=hexPoint(cx,cy,orr,t*.18-k*.006); c.fillStyle=`rgba(170,235,255,${(1-k/20)*.85})`; circle(c,p[0],p[1],u*.03*(1-k/24)); c.fill(); }
  const hp=hexPoint(cx,cy,orr,t*.18); c.fillStyle=rad(c,hp[0],hp[1],0,hp[0],hp[1],u*.1,[[0,"rgba(200,245,255,.9)"],[1,"rgba(200,245,255,0)"]]); circle(c,hp[0],hp[1],u*.1); c.fill();
},
parrot(c,w,h,t){
  const u=Math.min(w,h);
  c.fillStyle=lin(c,0,0,0,h,[[0,"#0f7a63"],[1,"#063b3a"]]); c.fillRect(0,0,w,h);
  const R=rng(5);
  for(let i=0;i<10;i++){ const x=R()*w,y=R()*h,L=u*(.4+R()*.4),a=R()*TAU+Math.sin(t*.8+i)*.08; leaf(c,x,y,L,a,i%2?"#14945c":"#0d6e47"); }
  const hx=w*.64, hy=h*.6, hr=u*.3;
  c.fillStyle="#2b6cff"; c.beginPath(); c.ellipse(hx+hr*.55,hy+hr*1.15,hr*.95,hr*.62,-.45,0,TAU); c.fill();
  c.fillStyle="#ffd23f"; c.beginPath(); c.ellipse(hx+hr*.35,hy+hr*.95,hr*.6,hr*.34,-.45,0,TAU); c.fill();
  c.fillStyle="#ffb000";
  for(let k=0;k<3;k++){ const sw=Math.sin(t*2+k)*hr*.05; c.beginPath(); c.moveTo(hx-hr*.25+k*hr*.28,hy-hr*.85); c.lineTo(hx-hr*.05+k*hr*.3+sw,hy-hr*1.5+k*hr*.12); c.lineTo(hx+k*hr*.28+hr*.05,hy-hr*.8); c.closePath(); c.fill(); }
  c.fillStyle=rad(c,hx-hr*.3,hy-hr*.4,hr*.1,hx,hy,hr,[[0,"#ff6b5b"],[1,"#d81e3a"]]); circle(c,hx,hy,hr); c.fill();
  c.fillStyle="#fff3e6"; c.beginPath(); c.ellipse(hx-hr*.3,hy-hr*.1,hr*.38,hr*.32,0,0,TAU); c.fill();
  const bl=(t%3.2)<.12?.15:1;
  c.fillStyle="#141414"; c.beginPath(); c.ellipse(hx-hr*.33,hy-hr*.12,hr*.12,hr*.12*bl,0,0,TAU); c.fill();
  c.fillStyle="#fff"; circle(c,hx-hr*.37,hy-hr*.17,hr*.035); c.fill();
  c.fillStyle="#ffd23f"; c.beginPath(); c.moveTo(hx-hr*.62,hy-hr*.28); c.quadraticCurveTo(hx-hr*1.3,hy-hr*.22,hx-hr*1.08,hy+hr*.38); c.quadraticCurveTo(hx-hr*.92,hy+hr*.1,hx-hr*.6,hy+hr*.22); c.closePath(); c.fill();
  c.fillStyle="#2a2a2a"; c.beginPath(); c.moveTo(hx-hr*.62,hy+hr*.2); c.lineTo(hx-hr*.9,hy+hr*.25); c.lineTo(hx-hr*.6,hy+hr*.4); c.closePath(); c.fill();
  const bx=hx-hr*1.3, by=hy+hr*.05, cols=["#00dcbe","#ffa000","#ff28aa"];
  c.lineCap="round"; c.lineWidth=Math.max(1.5,u*.028);
  for(let k=0;k<3;k++){ const ph=(t*.55+k/3)%1; c.strokeStyle=cols[k]; c.globalAlpha=1-ph; c.beginPath(); c.arc(bx,by,u*(.06+ph*.55),Math.PI*.8,Math.PI*1.2); c.stroke(); }
  c.globalAlpha=1; c.lineCap="butt";
},
brew(c,w,h,t){
  const u=Math.min(w,h), hue=(t*35)%360;
  c.fillStyle=rad(c,w*.5,h,0,w*.5,h,Math.max(w,h),[[0,"#4a1a6b"],[1,"#12061f"]]); c.fillRect(0,0,w,h);
  const cx=w*.5, cy=h*.86, rx=u*.5, ry=u*.34;
  c.fillStyle=rad(c,cx,cy-ry*.7,0,cx,cy-ry*.7,u*.9,[[0,`hsla(${hue},90%,60%,.5)`],[1,`hsla(${hue},90%,60%,0)`]]); c.fillRect(0,0,w,h);

  c.fillStyle="#2a2533"; c.beginPath(); c.ellipse(cx,cy-ry*.62,rx*.95,ry*.3,0,0,TAU); c.fill();
  c.fillStyle=`hsl(${hue},90%,55%)`; c.beginPath(); c.ellipse(cx,cy-ry*.6,rx*.82,ry*.21,0,0,TAU); c.fill();
  c.fillStyle=`hsla(${hue},100%,85%,.6)`; c.beginPath(); c.ellipse(cx-rx*.2,cy-ry*.64,rx*.25,ry*.05,0,0,TAU); c.fill();
  [[.1,.8,"#ff3048"],[.2,.9,"#30e070"],[.9,.84,"#4a7dff"]].forEach(([bx,by,col],i)=>{
    const x=w*bx, y=h*by, s=u*.08*(1+.05*Math.sin(t*2+i));
    c.fillStyle="rgba(255,255,255,.18)"; c.fillRect(x-s*.22,y-s*1.9,s*.44,s*.9);
    c.fillStyle="#8a5a3c"; c.fillRect(x-s*.26,y-s*2.15,s*.52,s*.3);
    c.fillStyle=col; circle(c,x,y,s); c.fill();
    c.fillStyle="rgba(255,255,255,.45)"; circle(c,x-s*.35,y-s*.35,s*.2); c.fill();
  });
},
highnoon(c,w,h,t){

{ id:"parrot", name:"Parrot", font:"'Chewy',cursive", ink:"#ffd23f", stroke:"#7a1020", ts:1.15, art:ART.parrot,

  controls:[["click","Teal call · 1 segment"],["double","Amber call · 2 segments"],["triple","Pink call · 3 segments"],["long","White call · all six"]],
  initCluster(C,now){ C.s={seq:[],ph:"wait",t0:now,idx:0,echo:null}; },
  noteOn(s){ return Math.max(360,700-s.seq.length*25); },
  addNote(C,now){ const s=C.s; s.seq.push({t:C.tiles[ri(C.tiles.length)], g:[1,1,2,2,3,"L"][ri(6)]}); s.ph="show"; s.t0=now; },
  update(C,dt,now){ const s=C.s, per=this.noteOn(s)+260;

  event(C,t,ev,now){ const s=C.s; if(s.ph!=="input") return; let g; if(ev.type==="click") g=ev.n; else if(ev.type==="long") g="L"; else return;

  draw(C,t,now){ const s=C.s; let L=six([6,10,10]);

    if(s.ph==="input"){ L=six(scl([0,90,60],pulse(now,1400,.12,.35))); if(s.echo&&s.echo.t===t&&now<s.echo.until){ const d=NOTE[s.echo.g]; d.f.forEach(f=>L[f]=d.c.slice()); } }
    if(s.ph==="good") L=L.map((c,f)=>scl([40,255,120],.2+.8*((Math.sin(now/90-f)+1)/2)));

{ id:"brew", name:"Hex Brew", font:"'Cinzel Decorative',serif", ink:"#e4ffbe", stroke:"#2a0b3d", ts:.82, art:ART.brew,
  pitch:"Mix red, green and blue light to match the potion.",
  solo:"The top three segments show the potion. The bottom three show your mix. Click adds red, double-click adds green, triple-click adds blue. Each color has three strengths, and a fourth dose of any color spoils the brew. Long press dumps the mix.",
  link:"Each tile becomes an ingredient. With two tiles, one holds red (click) and blue (double-click) while the other holds green. With three or more, every tile adds its own color with a single click. You'll have to talk it out.",
  controls:[["click","Add red"],["double","Add green"],["triple","Add blue"],["long","Dump the mix"]],
  target(prev){ let x; do{ x=[ri(4),ri(4),ri(4)]; }while(x[0]+x[1]+x[2]<2||(prev&&x.join()===prev.join())); return x; },
  initCluster(C,now){ C.s={mix:[0,0,0],target:this.target(null),fx:null,made:0,next:0,intro:C.tiles.length>1?now+1500:0}; },
  update(C,dt,now){ const s=C.s; if(s.next&&now>=s.next){ s.target=this.target(s.target); s.mix=[0,0,0]; s.next=0; } },
  event(C,t,ev,now){ const s=C.s; if(s.next) return;
    if(ev.type==="click"){ const ch=brewChans(C,t)[ev.n-1]; if(ch===undefined){ say(t,"no ingredient there"); return; }
      s.mix[ch]++; if(s.mix[ch]>3){ s.mix=[0,0,0]; s.fx={k:"bad",until:now+650}; say(t,`too much ${["red","green","blue"][ch]}`); return; }

{ id:"noon", name:"High Noon", font:"'Rye',serif", ink:"#ffe3b0", stroke:"#3b0a26", ts:.95, art:ART.highnoon, press:true,
  pitch:"Draw the instant the tile turns green.",
  solo:"Press to start. The tile glows red, then turns green after a random wait. Press as soon as you see green. More gold segments mean a faster draw. Pressing early fouls the round.",
  link:"Every touching tile is a gunslinger, and rounds start on their own. The fastest draw takes one segment from each opponent. Drawing early costs you a segment. Lose all six and you're out. Long press after the duel to start again.",
  controls:[["press","Start · draw"],["long","New duel when it's over"]],
  initTile(t){ t.s.best=0; },
  initCluster(C,now){ const N=C.tiles.length; C.s={ph:N>1?"lobby":"idle",t0:now,go:0,claims:new Map(C.tiles.map(t=>[t.id,Array(6).fill(null)])),out:new Set(),winner:null,rating:0}; },
  update(C,dt,now){ const s=C.s, N=C.tiles.length;
    if(s.ph==="lobby"&&now-s.t0>1500) hnWait(s,now);
    if(N>1&&(s.ph==="wait"||s.ph==="draw")){ const alive=C.tiles.filter(t=>!s.out.has(t.id)); if(alive.length<=1){ s.ph="over"; s.t0=now; s.winner=alive[0]||null; if(s.winner) say(s.winner,"last one standing"); return; } }
    if(s.ph==="wait"&&now>=s.go){ s.ph="draw"; s.t0=now; }
    if(s.ph==="draw"&&now-s.t0>(N>1?2200:1500)){ say(C.tiles[0],"too slow"); if(N>1) hnWait(s,now); else { s.ph="idle"; s.t0=now; } }
    if(s.ph==="early"&&now-s.t0>900){ s.ph="idle"; s.t0=now; }
    if(s.ph==="result"&&now-s.t0>1800){ if(N>1){ const alive=C.tiles.filter(t=>!s.out.has(t.id)); if(alive.length<=1){ s.ph="over"; s.t0=now; s.winner=alive[0]||null; if(s.winner) say(s.winner,"last one standing"); } else hnWait(s,now); } else { s.ph="idle"; s.t0=now; } } },
  event(C,t,ev,now){ const s=C.s, N=C.tiles.length;

    if(ev.type!=="down") return;
    if(N===1){
      if(s.ph==="idle") hnWait(s,now);
      else if(s.ph==="wait"){ s.ph="early"; s.t0=now; say(t,"too early"); }
      else if(s.ph==="draw"){ const ms=Math.round(now-s.t0); s.rating=ms<200?6:ms<240?5:ms<280?4:ms<330?3:ms<420?2:1; if(!t.s.best||ms<t.s.best){ t.s.best=ms; say(t,`${ms} ms · best`); } else say(t,`${ms} ms`); s.ph="result"; s.t0=now; }
    } else {
      if(s.out.has(t.id)) return;
      if(s.ph==="wait"){ hnClaim(s,t,[110,0,0]); say(t,s.out.has(t.id)?"fouled out":"too early"); }
      else if(s.ph==="draw"){ s.winner=t; const ms=Math.round(now-s.t0); say(t,`${ms} ms · wins`); C.tiles.forEach(o=>{ if(o!==t&&!s.out.has(o.id)) hnClaim(s,o,pc(t.p)); }); s.ph="result"; s.t0=now; }
    } },
  draw(C,t,now){ const s=C.s, N=C.tiles.length;
    if(N===1){
      if(s.ph==="idle") return six(scl([255,140,0],pulse(now,1600,.06,.3)));
      if(s.ph==="wait") return six([200,0,0]);
      if(s.ph==="early") return six(Math.floor(now/80)%2?[255,255,255]:[255,0,0]);
      if(s.ph==="draw") return six([0,255,60]);
      if(s.ph==="result") return [0,1,2,3,4,5].map(f=>f<s.rating?[255,190,30]:[14,8,0]);
      return six([0,0,0]); }
    const a=s.claims.get(t.id)||Array(6).fill(null), out=s.out.has(t.id);
    return a.map((cl,f)=>{
      if(cl) return scl(cl,out?.3:.8);
      if(out) return [6,6,6];
      if(s.ph==="over"&&s.winner===t) return hsv(now*.4+f*60);
      if(s.ph==="result"&&s.winner===t) return Math.floor(now/110)%2?pc(t.p):[255,255,255];
      if(s.ph==="wait") return [200,0,0];
      if(s.ph==="draw") return [0,255,60];
      return scl(pc(t.p),.35); }); } },

{ id:"ricochet", name:"Ricochet", font:"'Righteous',sans-serif", ink:"#7ff6ff", stroke:"#3d0060", ts:1.05, art:ART.ricochet, press:true,
  pitch:"Return the ball the moment it lands.",
  solo:"The ball flies to a segment. That segment flashes orange as the ball arrives and turns white when it lands. Press while it's white to return the ball. Rallies speed up. Press the blinking serve segment to start.",

  controls:[["press","Serve · return"]],
  initCluster(C,now){ C.s={ph:"serve",srv:C.tiles[0],sf:0,ball:null,dur:1100,rally:0,miss:null,t0:now}; },
  update(C,dt,now){ const s=C.s;

      if(P[i].t===t) L[P[i].f]=maxc(L[P[i].f],scl(BALL,1-u));
      if(P[i+1].t===t) L[P[i+1].f]=maxc(L[P[i+1].f],scl(BALL,u));
      const d=P[k], A=s.ball.start+s.ball.dur;
      if(d.t===t){ if(Math.abs(now-A)<=ricWin(s)) L[d.f]=[255,255,255]; else if(p>.5&&now<A) L[d.f]=maxc(L[d.f],scl([255,110,0],Math.floor(now/90)%2?1:.3)); } }
    if(s.ph==="miss"&&t===s.miss) return six(scl([255,0,0],1-(now-s.t0)/900));

{ id:"spill", name:"Spill", font:"'Shrikhand',cursive", ink:"#ffffff", stroke:"#1b1b3a", ts:1.2, art:ART.spill,
  pitch:"Flood the tile with one color in as few pours as you can.",
  solo:"You own the top segment and every matching segment touching it. Click to pick a new paint and your segments blink to preview it. Long press to pour. Your region takes that color and soaks up any matching neighbors. Cover all six.",

  controls:[["click","Next paint"],["long","Pour"],["click","New board when done"]],
  initCluster(C,now){ const s=C.s={col:new Map(),own:new Map(),ch:[],moves:[],done:false,t0:now};
    C.tiles.forEach(t=>{ for(let f=0;f<6;f++) s.col.set(sk(t,f),ri(4)); });
    C.tiles.forEach((t,p)=>{ s.own.set(sk(t,0),p); s.ch[p]=s.col.get(sk(t,0)); s.moves[p]=0; });

      const want=s.ch[o], c=cur===want?PAINT[cur]:(Math.floor(now/220)%2?PAINT[want]:PAINT[cur]);
      return scl(c,o===t.p?1:.8); });
    if(s.done) return L.map((c,f)=>scl(c,.55+.45*Math.sin(now/150+f)));

{ id:"safe", name:"Safecracker", font:"'Bungee',sans-serif", ink:"#ffd25e", stroke:"#0b1320", ts:.6, art:ART.safe, hold:true,

  controls:[["hold","Turn the dial · release to set"],["click","New safe once open"]],
  initCluster(C,now){ C.s={combo:Array.from({length:6},()=>ri(360)),st:new Map(C.tiles.map(t=>[t.id,{lock:Array(6).fill(false),cur:0,hold:false,h0:0,hs:0,jam:0,open:0}])),winner:null,wt:0}; },
  hue(st,now){ return (st.h0+(now-st.hs)*.11)%360; },
  event(C,t,ev,now){ const s=C.s, st=s.st.get(t.id); if(!st) return;
    if(s.winner||st.open){ if(ev.type==="click"&&now-(st.open||s.wt)>900) this.initCluster(C,now); return; }

      else { st.jam=now+450; say(t,"jammed"); } } },
  draw(C,t,now){ const s=C.s, st=s.st.get(t.id); if(!st) return six([0,0,0]);
    if(s.winner&&s.winner!==t) return six(scl([255,20,20],pulse(now,900,.05,.25)));

{ id:"honey", name:"Honeypot", font:"'Lilita One',sans-serif", ink:"#fff4d6", stroke:"#7a3300", ts:1.05, art:ART.honey, hold:true,

  link:"Bursts spill across touching edges into your neighbors' cells, so one greedy pour can set off a chain reaction through the whole hive.",
  controls:[["hold","Pour · release to seal"],["click","New hive when sealed"]],
  initCluster(C){ C.s={st:new Map(C.tiles.map(t=>[t.id,hpNew()])),q:[],fx:[],all:false}; },
  update(C,dt,now){ const s=C.s;

      if(st.fill[st.cur]>1){ say(t,"burst"); hpBurst(C,t,st.cur,now); } }
    const due=s.q.filter(e=>now>=e.at); s.q=s.q.filter(e=>now<e.at);

    if (grid.has(hk(q, r))) continue; const [px, py] = h2p(q, r);
    if (px < S * .8 || px > W - S * .8 || py < S * .8 || py > H - S * .8) continue;
    const d = Math.hypot(px - x, py - y); if (d < bd) { bd = d; best = [q, r]; }
  }
  if (!best) best = grid.has(hk(t.q, t.r)) ? (freeCell(false) || [t.q, t.r]) : [t.q, t.r];
  t.q = best[0]; t.r = best[1]; t.drag = null; grid.set(hk(t.q, t.r), t);
}

/* ---------- input ---------- */
function ptr(e) { const r = board.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function hitTile(x, y) { for (let i = tiles.length - 1; i >= 0; i--) { const t = tiles[i], [tx, ty] = tilePos(t), d = Math.hypot(x - tx, y - ty); if (d < S * .92) return {t, rim: d > S * .72}; } return null; }
function startDrag(pr, x, y) { pr.drag = true; const t = pr.t, [tx, ty] = h2p(t.q, t.r); grid.delete(hk(t.q, t.r)); t.drag = {x: tx, y: ty, dx: x - tx, dy: y - ty}; board.style.cursor = "grabbing"; }
board.addEventListener("pointerdown", e => {
  const [x, y] = ptr(e), h = hitTile(x, y); if (!h) return;
  e.preventDefault(); board.focus({preventScroll: true}); lastTouched = h.t;
  if (h.t.drag || [...presses.values()].some(p => p.t === h.t)) return;
  try { board.setPointerCapture(e.pointerId); } catch (err) {}
  const pr = {t: h.t, x0: x, y0: y, drag: false}; presses.set(e.pointerId, pr);
  if (h.rim) startDrag(pr, x, y); else buttonDown(h.t, performance.now());
});
board.addEventListener("pointermove", e => {
  const [x, y] = ptr(e), pr = presses.get(e.pointerId);
  if (!pr) { const h = hitTile(x, y); board.style.cursor = h ? (h.rim ? "grab" : "pointer") : "default"; return; }
  if (!pr.drag && Math.hypot(x - pr.x0, y - pr.y0) > 14) { buttonCancel(pr.t, performance.now()); startDrag(pr, x, y); }
  if (pr.drag && pr.t.drag) { pr.t.drag.x = x - pr.t.drag.dx; pr.t.drag.y = y - pr.t.drag.dy; }
});
function endPress(e) {
  const pr = presses.get(e.pointerId); if (!pr) return; presses.delete(e.pointerId);
  if (pr.drag) { if (pr.t.drag) dropTile(pr.t); board.style.cursor = "grab"; }
  else if (e.type === "pointercancel") buttonCancel(pr.t, performance.now());
  else buttonUp(pr.t, performance.now());
}
board.addEventListener("pointerup", endPress);
board.addEventListener("pointercancel", endPress);
board.addEventListener("contextmenu", e => e.preventDefault());
window.addEventListener("keydown", e => {
  if (e.code !== "Space" || e.repeat) return;
  const ae = document.activeElement; if (ae && ae !== board && ae !== document.body) return;
  const t = lastTouched && tiles.includes(lastTouched) ? lastTouched : tiles[0]; if (!t || t.drag) return;
  e.preventDefault(); lastTouched = t; kbdTile = t; buttonDown(t, performance.now());
});
window.addEventListener("keyup", e => { if (e.code === "Space" && kbdTile) { e.preventDefault(); buttonUp(kbdTile, performance.now()); kbdTile = null; } });

document.querySelectorAll("[data-layout]").forEach(b => b.addEventListener("click", () => setLayout(b.dataset.layout)));
$("#addTile").addEventListener("click", () => { const c = freeCell(true) || freeCell(false); if (c) { const t = addTile(c[0], c[1]); setTimeout(() => say(t, "drag me in by the rim"), 30); } });
$("#restart").addEventListener("click", () => loadGame(game));

/* ---------- loop ---------- */
let last = performance.now(), statusKey = "";
function frame(now) {
  const dt = Math.min(50, now - last); last = now;
  computeClusters(now);
  for (const t of tiles) { const b = t.btn;
    if (b.down && !b.long && now - b.downAt >= LONG_MS) { b.long = true; b.clicks = 0; emit(t, {type: "long"}, now); }
    if (!b.down && b.clicks && now - b.upAt > MULTI_MS) { const n = b.clicks; b.clicks = 0; emit(t, {type: "click", n}, now); } }
  for (const C of clusters.values()) game.update?.(C, dt, now);
  for (const t of tiles) {
    const C = t.C; let L = (C && game.draw(C, t, now)) || six([0,0,0]);
    if (C && C.tiles.length > 1) { const age = now - C.born; if (age < 700) { const k = (1 - age / 700) * .85; L = L.map((col, f) => C.nb(t, f) ? mix(col, [255,255,255], k) : col); } }
    t.leds = L.map(col => col.map(v => clamp(v || 0, 0, 255)));
  }
  const at = RM.matches ? 4 : now / 1000;
  sctx.setTransform(1, 0, 0, 1, 0, 0); game.art(sctx, splash.width, splash.height, at);
  drawBoard(now);
  carts.forEach(o => { if (!RM.matches && (o.g === game || o.g === hoverGame)) drawCart(o, at); });
  const groups = clusters.size, sk2 = tiles.length + "/" + groups;
  if (sk2 !== statusKey) { statusKey = sk2; $("#status").textContent = `${tiles.length} tile${tiles.length === 1 ? "" : "s"} · ${groups} group${groups === 1 ? "" : "s"} — press the center, drag by the rim, drop on the bin to remove · Space presses the last tile`; }
  requestAnimationFrame(frame);
}

buildShelf();
new ResizeObserver(sizeCarts).observe($("#carts"));
let start = GAMES[0];
try { const id = localStorage.getItem("hexarcade.game"); start = GAMES.find(g => g.id === id) || start; } catch (e) {}
setLayout("mixed");
loadGame(start);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(sizeCarts);
requestAnimationFrame(frame);
})();
</script>
</body>
